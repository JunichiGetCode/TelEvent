<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="iconCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E51C42" />
      <stop offset="50%" stop-color="#C60C30" />
      <stop offset="100%" stop-color="#8F0620" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#8F0620" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background plate / Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#iconCrimson)" filter="url(#badgeShadow)"/>
  <!-- Specular inner highlight -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="url(#innerGlow)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4"/>
  
  <!-- Subtle Event Calendar Grid Watermark -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="3" fill="none">
    <circle cx="256" cy="256" r="160" stroke-dasharray="8 8"/>
    <circle cx="256" cy="256" r="190" stroke-dasharray="4 8"/>
  </g>

  <!-- Modern Stylized T + E + Beacon Ticket Emblem -->
  <!-- Upper T bar with Ticket notch -->
  <path d="M128 176 C128 160 140 148 156 148 L356 148 C372 148 384 160 384 176 L384 204 C384 218 372 228 356 228 L302 228 L302 336 C302 352 290 364 274 364 L238 364 C222 364 210 352 210 336 L210 228 L156 228 C140 228 128 218 128 204 Z" fill="#FFFFFF"/>
  
  <!-- Glowing Beacon Sparkle (Top Right of T) -->
  <circle cx="360" cy="164" r="16" fill="#FFE4E8" />
  <path d="M360 140 L360 188 M336 164 L384 164" stroke="#C60C30" stroke-width="4" stroke-linecap="round"/>

  <!-- Dynamic Event Flow Curves (representing Stages, Campus, Energy) -->
  <path d="M164 276 C190 250 230 250 256 276 C282 302 322 302 348 276" stroke="#FFE4E8" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M184 316 C206 296 236 296 256 316 C276 336 306 336 328 316" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Base Badge Indicator Dot: Active Campus Pulse -->
  <circle cx="256" cy="406" r="12" fill="#FFFFFF"/>
  <circle cx="256" cy="406" r="22" stroke="#FFFFFF" stroke-width="3" opacity="0.4" fill="none"/>
</svg>
